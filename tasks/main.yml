---
- name: "Gather os specific variables {{ ansible_distribution }} - {{ ansible_distribution_major_version }}"
  include_vars: "{{ item }}"
  with_first_found:
    - "../vars/{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    - "../vars/{{ ansible_distribution }}.yml"
    - "../vars/{{ ansible_os_family }}.yml"

# ---------------------------------------------
# Preflight checks
# ---------------------------------------------
- name: Run preflight checks
  import_tasks: preflight.yml
  become: true

# ---------------------------------------------
# Install dependencies
# ---------------------------------------------
- name: Install dependencies
  import_tasks: dependencies.yml
  become: true

# --------------------------------------------------
# Create user/group
# --------------------------------------------------
- name: "Add miarec group '{{ miarec_screen_bin_group }}'"
  group:
    name: "{{ miarec_screen_bin_group }}"
    state: present
  when: miarec_screen_bin_group != 'root'

- name: "Add miarec user '{{ miarec_screen_bin_user }}'"
  user:
    name: "{{ miarec_screen_bin_user }}"
    group: "{{ miarec_screen_bin_group }}"
    comment: "MiaRec"
    shell: /bin/false
    system: true
  when: miarec_screen_bin_user != 'root'

# --------------------------------------------------
# Upload TLS files (optional)
# A file is uploaded when its *_src variable is set. The private keys get
# the group created above.
# --------------------------------------------------
- name: Upload TLS files
  import_tasks: tls.yml
  when: miarec_db_use_ssl | bool or miarec_redis_use_ssl | bool
  become: true

# --------------------------------------------------
# Configure TLS certificate permissions
# When TLS is enabled with client certificates, ensure the
# private key files are readable by the miarec_screen_bin_group
# --------------------------------------------------
- name: Set group ownership on TLS key files
  file:
    path: "{{ item }}"
    group: "{{ miarec_screen_bin_group }}"
    mode: "u=rw,g=r,o="
  loop: "{{ _tls_key_files | select | unique | list }}"
  vars:
    _tls_key_files:
      - "{{ miarec_db_tls_key_file if miarec_db_use_ssl | bool else '' }}"
      - "{{ miarec_redis_tls_key_file if miarec_redis_use_ssl | bool else '' }}"
  when: miarec_screen_bin_group != 'root'
  become: true

- name: Set group ownership on TLS key file directories
  file:
    path: "{{ item }}"
    group: "{{ miarec_screen_bin_group }}"
    mode: "u=rwx,g=rx,o="
  loop: "{{ _tls_key_files | select | map('dirname') | unique | list }}"
  vars:
    _tls_key_files:
      - "{{ miarec_db_tls_key_file if miarec_db_use_ssl | bool else '' }}"
      - "{{ miarec_redis_tls_key_file if miarec_redis_use_ssl | bool else '' }}"
  when: miarec_screen_bin_group != 'root'
  become: true

# --------------------------------------------------
# Initialize the installation/upgrade process
# --------------------------------------------------
- name: Initialize the deploy root and gather facts
  deploy_helper:
    path: "{{ miarec_screen_install_dir }}"
    release: "{{ miarec_screen_version }}"
    mode: u=rwX,g=rX,o=rX
  become: true

# --------------------------------------------------
# Install/upgrade 'miarec' app files
# --------------------------------------------------
- name: Install miarec_screen
  import_tasks: install.yml
  become: true

# --------------------------------------------------
# Cleanup old and unfinished releases
# --------------------------------------------------
- name: Cleanup old releases
  deploy_helper:
    path: "{{ miarec_screen_install_dir }}"
    release: '{{ deploy_helper.new_release }}'
    state: finalize
    keep_releases: 10
  notify:
    - Restart miarec_screen
  become: true
