---
# Verify that the service user can read the TLS files. A file that the
# service cannot open fails the play here, with the previous release still
# active, instead of failing the service at its next restart, which may go
# unnoticed for a long time.
#
# The check runs as miarec_screen_bin_user, the identity the service actually
# uses. runuser applies the user's supplementary groups, as systemd does, so
# the check also proves the group membership. `test -r` covers traversal of
# every directory and read permission on the file itself, for files the role
# uploaded and files that arrived by other means.

- name: Start with an empty list of TLS files
  set_fact:
    _miarec_screen_tls_paths: []

- name: Add the PostgreSQL TLS files
  set_fact:
    _miarec_screen_tls_paths: "{{ _miarec_screen_tls_paths + [miarec_db_tls_ca_file, miarec_db_tls_cert_file, miarec_db_tls_key_file] }}"
  when: miarec_db_use_ssl | bool

- name: Add the Redis TLS files
  set_fact:
    _miarec_screen_tls_paths: "{{ _miarec_screen_tls_paths + [miarec_redis_tls_ca_file, miarec_redis_tls_cert_file, miarec_redis_tls_key_file] }}"
  when: miarec_redis_use_ssl | bool

# `select` drops an empty path, for a deployment without a client certificate.
# `unique` handles a CA file shared by both services.
- name: Verify the service user can read the TLS files
  command: runuser -u {{ miarec_screen_bin_user | quote }} -- test -r {{ item | quote }}
  loop: "{{ _miarec_screen_tls_paths | select | unique | list }}"
  changed_when: false
